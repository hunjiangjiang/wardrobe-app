name: 构建 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 android-actions/setup-android（它内部 sdkmanager 会失败）
      # runner 镜像自带 Android SDK，直接复用并接受许可即可
      - name: 准备 Android SDK（使用预装版本）
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          echo "--- 已有 platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- 已有 build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | head -n 1)
          echo "sdkmanager = $SDKM"

          if [ -n "$SDKM" ]; then
            chmod +x "$SDKM" || true
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi

          echo "--- 最终 platforms ---"
          ls "$ANDROID_HOME/platforms" || true

      - name: 安装 npm 依赖
        run: npm install

      - name: 生成 Android 工程并同步网页资源
        run: |
          npx cap add android
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: 发布到 Release（方便手机直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 我的衣橱 APK（最新）
          body: |
            自动构建的最新测试版 APK。
            手机浏览器打开本页，下载下面的 app-debug.apk 即可安装。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
